[theme]
base = "light"
primaryColor = "#0969DA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F8"
textColor = "#1F2328"
linkColor = "#0969DA"
borderColor = "#D5DCE4"
baseRadius = "0.4rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
chartCategoricalColors = ["#0969DA", "#C99400", "#A66CFF", "#3FBF6F", "#F2994A", "#EB5757", "#9AA8BD"]

[theme.sidebar]
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#F1F4F8"

[server]
headless = true

[browser]
gatherUsageStats = false
